# Flag Guardian — full local stack.
#
#   docker compose up -d                 # Flagsmith + Prometheus + Grafana
#   docker compose --profile app up -d   # + guardian, demo-shop, loadgen (once built)
#
# Flagsmith section is based on the official compose file:
# https://github.com/Flagsmith/flagsmith/blob/main/docker-compose.yml
# Images are pinned to the versions this was tested with. FLAGSMITH_IMAGE overrides Flagsmith's.
#
# LOCAL DEMO DEFAULTS, NOT FOR PRODUCTION: well-known Postgres/Django/Grafana secrets,
# DJANGO_ALLOWED_HOSTS='*', Grafana anonymous viewer, unauthenticated Prometheus lifecycle API,
# the demo-shop bug switch, and a Guardian control API with no token (any container on this
# network can call it). To keep that safe every published port binds to 127.0.0.1
# (BIND_ADDRESS). Before exposing anything: set BIND_ADDRESS, DJANGO_SECRET_KEY,
# WAREHOUSE_CREDENTIALS_SECRET, GRAFANA_ADMIN_PASSWORD, GUARDIAN_API_TOKEN and
# FLAGSMITH_WEBHOOK_SECRET, set DEMO_ADMIN=false, and restrict DJANGO_ALLOWED_HOSTS.

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'                # local demo only
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-change-me}
  WAREHOUSE_CREDENTIALS_SECRET: ${WAREHOUSE_CREDENTIALS_SECRET:-local-dev-secret-change-me}
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:
  grafana-data:
  guardian-data:

services:
  # ---------------- Flagsmith (self-hosted) ----------------
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2}
    command: [migrate]
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2}
    restart: unless-stopped
    command: [serve]
    environment:
      <<: *flagsmith-env
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8000:8000'
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: ${FLAGSMITH_IMAGE:-docker.flagsmith.com/flagsmith/flagsmith:2.295.2}
    restart: unless-stopped
    command: [run-task-processor]
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  # ---------------- Observability ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9090:9090'

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3000:3000'
    depends_on:
      - prometheus

  # ---------------- Flag Guardian + demo (profile: app) ----------------
  guardian:
    profiles: [app]
    build: ./packages/guardian
    restart: unless-stopped
    env_file: .env
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      GUARDIAN_CONFIG: /config/flags.yaml
      GUARDIAN_DATA_DIR: /data
      GUARDIAN_PUBLIC_URL: http://localhost:8787
      GUARDIAN_TICK_SECONDS: '5'
      # Listen on all interfaces *inside* the container so the port mapping and Prometheus can
      # reach it; the published port below is still loopback-only. Other containers on this
      # network can call the control API without a token: set GUARDIAN_API_TOKEN beyond a demo.
      GUARDIAN_HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Kolkata}   # only affects log timestamps
    volumes:
      - ./flags.yaml:/config/flags.yaml:ro
      - guardian-data:/data
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8787:8787'
    depends_on:
      flagsmith:
        condition: service_healthy
      prometheus:
        condition: service_started

  demo-shop:
    profiles: [app]
    build: ./examples/demo-shop
    restart: unless-stopped
    environment:
      # Only the SDK key: the demo app never sees the organisation API key.
      # Not `:?`: Compose interpolates inactive profiles too, so a required variable would break
      # the first `docker compose up -d`, before Flagsmith exists to issue the key. demo-shop
      # exits with a clear message when it is empty.
      FLAGSMITH_ENVIRONMENT_KEY: ${FLAGSMITH_ENVIRONMENT_KEY:-}
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      FLAGSMITH_REFRESH_SECONDS: '3'
      BUGGY_CHECKOUT: ${BUGGY_CHECKOUT:-false}
      # enables POST /admin/bug (planted-bug switch for the demo); port is loopback-only
      DEMO_ADMIN: ${DEMO_ADMIN:-true}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3001:3001'
    depends_on:
      flagsmith:
        condition: service_healthy

  loadgen:
    profiles: [app]
    build: ./examples/loadgen
    restart: unless-stopped
    environment:
      TARGET_URL: http://demo-shop:3001
      USERS: ${LOADGEN_USERS:-200}
      RPS: ${LOADGEN_RPS:-20}
    depends_on:
      - demo-shop

  # ---------------- Public tunnel (profile: tunnel, optional) ----------------
  # Flagsmith refuses webhook and integration URLs that point at private addresses (SSRF
  # protection), so on a single machine it cannot call http://guardian or http://grafana
  # directly. ngrok gives one public HTTPS URL, which points at a small gateway that forwards
  # only POST /webhooks/flagsmith (→ Guardian) and POST /api/annotations (→ Grafana). Every other
  # path is 404, so the Guardian UI/API and the Grafana UI are not exposed.
  # Set FLAGSMITH_WEBHOOK_SECRET first: through the gateway Guardian refuses unsigned webhooks.
  # Public URL: `docker compose --profile tunnel logs ngrok` (line with url=https://...).
  gateway:
    profiles: [tunnel]
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # No depends_on guardian: nginx resolves upstreams per request, and a dependency on an
    # `app`-profile service would make `--profile tunnel` alone an invalid project.
    depends_on:
      - grafana

  ngrok:
    profiles: [tunnel]
    image: ngrok/ngrok:3.39.13-alpine
    restart: unless-stopped
    command: ['start', '--all', '--config', '/etc/ngrok.yml']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./infra/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    # No published port: ngrok's local inspector/API is disabled (see infra/ngrok/ngrok.yml).
    depends_on:
      - gateway
