# Public gateway behind the ngrok tunnel (profile "tunnel").
# Only the two calls Flagsmith makes are forwarded: unknown paths get 404, other methods on the
# two paths get 403, so the Guardian UI/API and the Grafana UI stay private while the tunnel is up.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;           # same cap as Guardian's webhook parser
    client_header_timeout 10s;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Docker's DNS, looked up per request (the upstreams below are variables): a recreated
    # guardian/grafana container gets a new IP, and nginx would otherwise keep the old one
    # until restarted. It also lets the gateway start before Guardian exists.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Why every proxy_pass names the full upstream path: `location =` matches the *decoded,
    # normalised* path, but a proxy_pass without a path forwards the client's raw path. Then
    # POST /api/user/using/1%2F..%2F..%2F..%2Fannotations matches here and reaches a different
    # Grafana route. With a path, the upstream always receives exactly that path (query dropped).

    # Flagsmith environment webhook (Guardian checks the X-Flagsmith-Signature HMAC). nginx
    # forwards the body bytes unchanged, so the signature still verifies.
    location = /webhooks/flagsmith {
        limit_except POST { deny all; }
        set $guardian guardian:8787;
        # Tells Guardian the request came from the internet, so it refuses unsigned webhooks
        # even when FLAGSMITH_WEBHOOK_SECRET is unset. proxy_set_header replaces any client copy.
        proxy_set_header X-Guardian-Public-Gateway 1;
        proxy_pass http://$guardian/webhooks/flagsmith;
    }

    # Flagsmith Grafana integration: POST {base_url}/api/annotations with a Bearer token.
    location = /api/annotations {
        limit_except POST { deny all; }
        # Only service-account tokens: no Basic auth (admin password guessing from the internet)
        # and no browser session cookie.
        if ($http_authorization !~ "^Bearer [^ ]+$") { return 401; }
        proxy_set_header Cookie "";
        set $grafana grafana:3000;
        proxy_pass http://$grafana/api/annotations;
    }

    location / {
        return 404;
    }
}
